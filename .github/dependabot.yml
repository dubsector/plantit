version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # paper-api tracks the Minecraft version this plugin targets, not the
      # newest release. It must stay in lockstep with PAPER_VERSION in
      # build.yml and the version quoted in the README and release notes.
      # Retargeting Minecraft is a deliberate change, so bump it by hand.
      - dependency-name: "io.papermc.paper:paper-api"
    groups:
      maven-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
